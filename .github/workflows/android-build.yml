name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (platform 35 + build-tools 35)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          mkdir -p "$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          if [ ! -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ] && [ ! -f "$ANDROID_HOME/cmdline-tools/bin/sdkmanager" ]; then
            wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            mkdir -p "$ANDROID_HOME/cmdline-tools/latest"
            unzip -q commandlinetools-linux-11076708_latest.zip -d "$ANDROID_HOME/cmdline-tools/latest"
            mv "$ANDROID_HOME/cmdline-tools/latest/cmdline-tools/"* "$ANDROID_HOME/cmdline-tools/latest/"
          fi
          SDK_MANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ ! -f "$SDK_MANAGER" ] && SDK_MANAGER="$ANDROID_HOME/cmdline-tools/bin/sdkmanager"
          yes | "$SDK_MANAGER" --licenses > /dev/null || true
          "$SDK_MANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          echo "SDK ready"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: didwana-techcare-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
